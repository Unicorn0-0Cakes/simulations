<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulations</title>
<meta name="description" content="A collection of interactive, self-contained browser simulations.">
<style>
  :root{
    --bg:#0b0d12; --panel:#141821; --panel2:#1b202b; --line:#28303e;
    --ink:#e8ecf4; --muted:#8b95a7; --accent:#6ea8fe;
    --normal:#3fb96b; --stressed:#e8c447; --aggressive:#e5484d;
    --withdrawn:#4a7bff; --beautiful:#c96bd8;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
    line-height:1.55;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 500px at 15% -10%,rgba(110,168,254,.10),transparent 60%),
                     radial-gradient(700px 500px at 100% 0%,rgba(201,107,216,.08),transparent 55%);}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px}

  header.hero{padding:64px 0 34px;text-align:center}
  .hero .eyebrow{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);font-weight:700}
  .hero h1{font-size:clamp(32px,6vw,52px);margin:12px 0 10px;line-height:1.05;letter-spacing:-.5px}
  .hero p{max-width:620px;margin:0 auto;color:var(--muted);font-size:16px}

  .count{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px;
    padding:18px 0 12px;border-bottom:1px solid var(--line);margin-bottom:24px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding-bottom:60px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;transition:.18s ease;position:relative}
  .card:hover{transform:translateY(-4px);border-color:var(--accent);
    box-shadow:0 14px 40px rgba(0,0,0,.45)}
  .card .thumb{aspect-ratio:16/9;position:relative;overflow:hidden;border-bottom:1px solid var(--line);
    background:#080a0e}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .body{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1}
  .card .tag{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .card h2{font-size:20px;margin:6px 0 8px}
  .card p{margin:0 0 16px;color:var(--muted);font-size:14px;flex:1}
  .card .go{align-self:flex-start;background:var(--accent);color:#08101f;font-weight:700;font-size:13px;
    padding:9px 16px;border-radius:10px;transition:.15s}
  .card:hover .go{filter:brightness(1.08)}
  .stretched{position:absolute;inset:0;z-index:1}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);
    padding:3px 9px;border-radius:999px}

  footer{border-top:1px solid var(--line);padding:26px 0 60px;color:var(--muted);font-size:13px;text-align:center}
  footer a{color:var(--accent)}
</style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="eyebrow">Interactive Simulations</div>
      <h1>Simulations</h1>
      <p>A collection of self-contained, browser-based simulations. No install, nothing to set up &mdash; just click and explore.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div class="wrap">Built for the web &middot; open any simulation directly in your browser.</div>
  </footer>

<script>
/* ---------------------------------------------------------------
   Add a new simulation by dropping another object into this array.
   thumb: pass a URL to your own screenshot, OR leave it out / set
   to null to use the built-in generated preview keyed by `preview`.
----------------------------------------------------------------*/
const SIMULATIONS = [
  {
    title: "Universe 25",
    tag: "Behavioral Ecology",
    href: "universe-25/universe25.html",
    preview: "universe25",
    thumb: null,
    description: "A living recreation of Calhoun's “mouse utopia” — unlimited resources, limited space. Watch a colony rise and collapse through Growth → Breakdown → Collapse, with predators, terrain, water, fish and birds all interacting.",
    chips: ["Mice & predators", "Terrain & water", "Live charts", "Presets"]
  },
  {
    title: "The Commons",
    tag: "Cooperation & Collapse",
    href: "commons/commons.html",
    preview: "commons",
    thumb: null,
    description: "Everyone gets their own resources, but survival depends on a shared system nobody is forced to maintain. Write the rules of the society — abundance, visibility, punishment, information accuracy — then watch what kind of society emerges, and what its survival costs.",
    chips: ["Public-goods game", "Emergent behavior", "Trust & rumor", "Live dashboard"]
  },
  {
    title: "Biosphere: Closed World",
    tag: "Closed Ecological Systems",
    href: "biosphere/biosphere.html",
    preview: "biosphere",
    thumb: null,
    description: "Eight people, seven biomes and one atmosphere with nowhere to go, sealed inside three acres of glass. Oxygen starts disappearing and carbon dioxide doesn't rise to match. Diagnose a living machine through imperfect instruments, and decide what you'll break to keep everyone breathing.",
    chips: ["Causal diagnosis", "Carbon & oxygen budget", "Hypothesis workbench", "Historically informed"]
  }
  // ,{
  //   title: "Next Simulation",
  //   tag: "Category",
  //   href: "next-sim.html",
  //   preview: null,
  //   thumb: "screenshots/next-sim.png",
  //   description: "One-line description of the next simulation.",
  //   chips: ["tag one", "tag two"]
  // }
];

/* Built-in generated preview cards (used when thumb is null). */
function previewSVG(key){
  if(key === "universe25"){
    let dots = "";
    const cols = ["#3fb96b","#e8c447","#e5484d","#4a7bff","#c96bd8"];
    let seed = 7;
    const rnd = () => (seed = (seed*9301+49297)%233280) / 233280;
    for(let i=0;i<90;i++){
      const x = 6 + rnd()*308, y = 6 + rnd()*164;
      const c = cols[Math.floor(rnd()*cols.length)];
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.6+rnd()*1.8).toFixed(1)}" fill="${c}"/>`;
    }
    return `<svg viewBox="0 0 320 176" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <rect width="320" height="176" fill="#080a0e"/>
      <rect x="34" y="96" width="70" height="34" rx="9" fill="#12331f" opacity=".8"/>
      <rect x="150" y="30" width="52" height="26" rx="8" fill="#12331f" opacity=".7"/>
      <ellipse cx="248" cy="120" rx="46" ry="30" fill="#12283f" opacity=".85"/>
      <path d="M0 70 q80 -22 160 6 t160 0" stroke="#1c4a6b" stroke-width="12" fill="none" opacity=".6"/>
      ${dots}
    </svg>`;
  }
  if(key === "commons"){
    const fc = ["#6ea8fe","#c96bd8","#3fb9a8"];
    const coop = ["#3fb96b","#e8c447","#e5484d"];
    let seed = 11;
    const rnd = () => (seed = (seed*9301+49297)%233280) / 233280;
    const cx=160, cy=88;
    let nodes = "";
    // three faction clusters around the commons
    const centers=[[70,52],[250,58],[160,146]];
    centers.forEach((c,f)=>{
      for(let i=0;i<8;i++){
        const x=c[0]+rnd()*46-23, y=c[1]+rnd()*40-20;
        const col=coop[Math.floor(rnd()*coop.length)];
        const r=2.4+rnd()*3.4;
        nodes += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(cx+(x-cx)*0.4).toFixed(1)}" y2="${(cy+(y-cy)*0.4).toFixed(1)}" stroke="${fc[f]}" stroke-width="${(0.4+rnd()*1.4).toFixed(1)}" opacity=".28"/>`;
        nodes += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r+1.4).toFixed(1)}" fill="${fc[f]}" opacity=".22"/>`;
        nodes += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}"/>`;
      }
    });
    return `<svg viewBox="0 0 320 176" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <rect width="320" height="176" fill="#080a0e"/>
      ${nodes}
      <circle cx="${cx}" cy="${cy}" r="30" fill="#0c1016" stroke="#26303e" stroke-width="2"/>
      <clipPath id="cm"><circle cx="${cx}" cy="${cy}" r="27"/></clipPath>
      <rect x="${cx-30}" y="${cy-2}" width="60" height="30" fill="#3fb9a8" opacity=".8" clip-path="url(#cm)"/>
      <text x="${cx}" y="${cy+3}" fill="#e8ecf4" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">72%</text>
    </svg>`;
  }
  if(key === "biosphere"){
    // section through the glass: rainforest, ocean, savanna, desert, farm, habitat
    let trees = "";
    let seed = 23;
    const rnd = () => (seed = (seed*9301+49297)%233280) / 233280;
    for(let i=0;i<11;i++){
      const x = 12 + i*7.6, h = 26 + rnd()*46;
      trees += `<rect x="${(x-0.7).toFixed(1)}" y="${(122-h*0.42).toFixed(1)}" width="1.4" height="${(h*0.42).toFixed(1)}" fill="#1c5a34"/>`;
      trees += `<ellipse cx="${x.toFixed(1)}" cy="${(122-h*0.62).toFixed(1)}" rx="${(h*0.17).toFixed(1)}" ry="${(h*0.3).toFixed(1)}" fill="#2f8f52"/>`;
    }
    let crops = "";
    for(let i=0;i<16;i++){
      const x = 206 + i*4.2, h = 5 + rnd()*16;
      crops += `<rect x="${x.toFixed(1)}" y="${(122-h).toFixed(1)}" width="2.8" height="${h.toFixed(1)}" fill="#6faa3a"/>`;
    }
    let beads = "";
    for(let i=0;i<40;i++){
      beads += `<circle cx="${(10+rnd()*300).toFixed(1)}" cy="${(30+rnd()*88).toFixed(1)}" r="${(0.7+rnd()*1.1).toFixed(1)}" fill="#8fc4ea" opacity="${(0.2+rnd()*0.4).toFixed(2)}"/>`;
    }
    // the oxygen line: falls, while CO2 stays flat then lifts late
    let o2 = "M8 44", co2 = "M8 62";
    for(let i=1;i<=16;i++){
      o2  += ` L${(8+i*19.5).toFixed(0)} ${(44+i*1.5+Math.sin(i*1.7)*1.4).toFixed(1)}`;
      co2 += ` L${(8+i*19.5).toFixed(0)} ${(62-Math.max(0,i-11)*2.2+Math.sin(i*2.1)*0.8).toFixed(1)}`;
    }
    return `<svg viewBox="0 0 320 176" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <rect width="320" height="176" fill="#0d1117"/>
      <rect x="0" y="122" width="320" height="54" fill="#161b23"/>
      <rect x="0" y="132" width="320" height="44" fill="#12161d"/>
      <path d="M6 122 L6 40 L52 20 L98 40 L98 122" fill="#2c6ba0" fill-opacity=".07" stroke="#28303e"/>
      <path d="M98 122 L98 66 L128 54 L158 66 L158 122" fill="#2c6ba0" fill-opacity=".07" stroke="#28303e"/>
      <path d="M158 122 L158 72 L182 60 L206 72 L206 122" fill="#2c6ba0" fill-opacity=".07" stroke="#28303e"/>
      <path d="M206 122 L206 58 L246 44 L286 58 L286 122" fill="#2c6ba0" fill-opacity=".07" stroke="#28303e"/>
      <path d="M286 122 L286 62 L302 52 L314 62 L314 122" fill="#2c6ba0" fill-opacity=".07" stroke="#28303e"/>
      <rect x="98" y="104" width="60" height="18" fill="#2f6fb0" opacity=".8"/>
      <rect x="158" y="112" width="48" height="10" fill="#c98f6b" opacity=".6"/>
      ${trees}${crops}
      <rect x="288" y="86" width="22" height="36" fill="#c08b46" opacity=".5"/>
      ${beads}
      <rect x="10" y="140" width="34" height="14" rx="2" fill="#63768c" opacity=".55"/>
      <rect x="50" y="140" width="34" height="14" rx="2" fill="#63768c" opacity=".55"/>
      <rect x="90" y="140" width="34" height="14" rx="2" fill="#b3372f" opacity=".55"/>
      <rect x="130" y="140" width="34" height="14" rx="2" fill="#63768c" opacity=".55"/>
      <path d="${o2}" stroke="#5a9fd8" stroke-width="1.8" fill="none"/>
      <path d="${co2}" stroke="#d69a4e" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
      <text x="8" y="16" fill="#5a9fd8" font-size="8" font-family="monospace">O₂ 20.9 → 16.6%</text>
      <text x="240" y="16" fill="#d69a4e" font-size="8" font-family="monospace">CO₂ flat</text>
    </svg>`;
  }
  // generic fallback
  return `<svg viewBox="0 0 320 176" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="176" fill="#0f1420"/>
    <circle cx="160" cy="88" r="34" fill="none" stroke="#6ea8fe" stroke-width="3" opacity=".7"/>
    <circle cx="160" cy="88" r="6" fill="#6ea8fe"/>
  </svg>`;
}

const grid = document.getElementById("grid");
const n = SIMULATIONS.length;
document.getElementById("count").textContent = n + (n === 1 ? " simulation" : " simulations");

grid.innerHTML = SIMULATIONS.map(s => {
  const thumb = s.thumb
    ? `<img src="${s.thumb}" alt="${s.title} preview">`
    : previewSVG(s.preview);
  const chips = (s.chips || []).map(c => `<span class="chip">${c}</span>`).join("");
  return `
    <article class="card">
      <a class="stretched" href="${s.href}" aria-label="Open ${s.title}"></a>
      <div class="thumb">${thumb}</div>
      <div class="body">
        <span class="tag">${s.tag}</span>
        <h2>${s.title}</h2>
        <p>${s.description}</p>
        ${chips ? `<div class="chips">${chips}</div>` : ""}
        <span class="go">Open simulation →</span>
      </div>
    </article>`;
}).join("");
</script>
</body>
</html>
